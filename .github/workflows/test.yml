name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # Fingerprinting, subsumption and candidate synthesis are pure functions —
    # no database required. The end-to-end demo needs Postgres and is run
    # manually via scripts/demo.sh.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
