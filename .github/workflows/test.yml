name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # Subsumption and candidate synthesis are pure functions — no database
    # required. The end-to-end demo needs Postgres and is run manually via
    # scripts/demo.sh.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest

  e2e:
    # Exercises the real claim: queries go into Postgres, the plan tree comes
    # back out of its log. Needs a cluster whose log file we can read, so it
    # runs its own via initdb rather than a service container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Put PostgreSQL binaries on PATH
        run: echo "$(ls -d /usr/lib/postgresql/*/bin | tail -1)" >> "$GITHUB_PATH"
      - run: pip install -e ".[dev]"
      - run: ./scripts/e2e.sh
